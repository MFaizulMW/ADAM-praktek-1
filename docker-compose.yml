name: bpjs-bigdata

x-spark-common: &spark-common
  build: ./spark
  image: bpjs/spark:3.5.3
  env_file: .env
  networks: [bpjs]

services:
  # =====================================================================
  # OLTP : PostgreSQL primary (write) + streaming read replica (read)
  # =====================================================================
  pg-primary:
    image: postgres:16
    env_file: .env
    command:
      - postgres
      - -c
      - wal_level=logical          # cukup untuk physical replica + logical decoding (Debezium)
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - wal_keep_size=512MB
      - -c
      - hot_standby=on
    ports: ["5432:5432"]
    volumes:
      - pg-primary-data:/var/lib/postgresql/data
      - ./postgres/primary/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [bpjs]

  pg-replica:
    image: postgres:16
    env_file: .env
    user: postgres
    entrypoint: ["bash", "/scripts/replica-entrypoint.sh"]
    ports: ["5433:5432"]
    volumes:
      - pg-replica-data:/var/lib/postgresql/data
      - ./postgres/replica/replica-entrypoint.sh:/scripts/replica-entrypoint.sh:ro
    depends_on:
      pg-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [bpjs]

  # =====================================================================
  # CDC : Kafka (KRaft) + Debezium Kafka Connect
  # =====================================================================
  kafka:
    image: apache/kafka:3.8.0
    ports: ["29092:29092"]
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk   # base64 UUID (22 char) untuk KRaft
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks: [bpjs]

  debezium:
    image: quay.io/debezium/connect:2.7
    ports: ["8083:8083"]
    env_file: .env                 # DEBEZIUM_USER / DEBEZIUM_PASSWORD / POSTGRES_DB dibaca connector via ${env:...}
    environment:
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: bpjs-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    depends_on:
      kafka:
        condition: service_healthy
      pg-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [bpjs]

  # one-shot: daftarkan connector Postgres -> Kafka (idempotent, PUT)
  debezium-init:
    image: curlimages/curl:8.10.1
    volumes:
      - ./debezium/bpjs-postgres-connector.json:/config/connector.json:ro
    entrypoint: ["sh", "-c"]
    command:
      - >
        curl -fsS -X PUT -H 'Content-Type: application/json'
        --data @/config/connector.json
        http://debezium:8083/connectors/bpjs-postgres-cdc/config && echo ' -> connector registered'
    depends_on:
      debezium:
        condition: service_healthy
    restart: "no"
    networks: [bpjs]

  # =====================================================================
  # Data lake : MinIO (S3) — bucket lakehouse/{bronze,silver,gold}
  # =====================================================================
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    env_file: .env
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [bpjs]

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    env_file: .env
    entrypoint: ["sh", "-c"]
    command:
      - >
        mc alias set lake http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing lake/$${LAKEHOUSE_BUCKET} &&
        echo ' -> bucket ready'
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks: [bpjs]

  # =====================================================================
  # Processing : Spark standalone cluster + 2 aplikasi
  # =====================================================================
  spark-master:
    <<: *spark-common
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    ports: ["7077:7077", "8090:8080"]

  spark-worker:
    <<: *spark-common
    hostname: spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: "4"
      SPARK_WORKER_MEMORY: "4g"
    ports: ["8091:8081"]
    depends_on: [spark-master]

  # Kafka (CDC) -> BRONZE parquet  (Structured Streaming, jalan terus)
  spark-bronze:
    <<: *spark-common
    hostname: spark-bronze
    command: ["bash", "/opt/jobs/submit.sh", "spark-bronze", "/opt/jobs/bronze_stream.py"]
    volumes:
      - ./spark/jobs:/opt/jobs:ro
    depends_on:
      spark-worker:
        condition: service_started
      kafka:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # BRONZE -> SILVER -> GOLD (parquet + Elasticsearch), micro-batch berkala
  spark-pipeline:
    <<: *spark-common
    hostname: spark-pipeline
    command: ["bash", "/opt/jobs/submit.sh", "spark-pipeline", "/opt/jobs/pipeline_loop.py"]
    volumes:
      - ./spark/jobs:/opt/jobs:ro
    depends_on:
      spark-worker:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # =====================================================================
  # Serving (gold / data mart) : Elasticsearch
  # =====================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports: ["9200:9200"]
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
    networks: [bpjs]

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    profiles: ["tools"]          # opsional: docker compose --profile tools up -d
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports: ["5601:5601"]
    depends_on: [elasticsearch]
    networks: [bpjs]

  # =====================================================================
  # Aplikasi : Backend (FastAPI/uvicorn) + Frontend (HTML via nginx)
  # =====================================================================
  backend:
    build: ./backend
    image: bpjs/backend:latest
    env_file: .env
    environment:
      PRIMARY_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pg-primary:5432/${POSTGRES_DB}
      REPLICA_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pg-replica:5432/${POSTGRES_DB}
      ES_URL: http://elasticsearch:9200
    ports: ["8000:8000"]
    depends_on:
      pg-primary:
        condition: service_healthy
      pg-replica:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks: [bpjs]

  frontend:
    image: nginx:1.27-alpine
    ports: ["8088:80"]
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend]
    networks: [bpjs]

networks:
  bpjs:
    driver: bridge

volumes:
  pg-primary-data:
  pg-replica-data:
  kafka-data:
  minio-data:
  es-data:
